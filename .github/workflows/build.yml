name: Build SFMobDrops Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEGACY_ARTIFACT_VERSION: "1.0.4"
  OUTPUT_NAME: "SF_MobDrops1.0.4.jar"
  SLIMEFUN_LEGACY_VERSION: "4.1.46"

concurrency:
  group: sfmobdrops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject automatic release publication and clobber
        run: python3 -m unittest discover -s scripts -p 'test_release_safety.py' -v

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install checksum-verified Apache Maven 3.10.0
        run: bash scripts/install_maven_3_10.sh

      - name: Install Slimefun Legacy 4.1.46 into local Maven repo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy-deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" --repo wickidcow/Slimefun-Legacy --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" --dir legacy-deps
          LEGACY_JAR="legacy-deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar"
          test -s "$LEGACY_JAR"
          mvn -B install:install-file -Dfile="$LEGACY_JAR" -DgroupId=com.github.wickidcow -DartifactId=Slimefun-Legacy -Dversion="${SLIMEFUN_LEGACY_VERSION}" -Dpackaging=jar -DgeneratePom=true

      - name: Verify compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.4</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq '<fork>true</fork>' pom.xml
          grep -Fq '<artifactId>mockbukkit-v26.2</artifactId>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml

      - name: Run MobDrops unit tests with MockBukkit 26.2 and Slimefun Legacy
        run: >-
          mvn -B
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean test --file pom.xml

      - name: Compile against Slimefun Legacy / Paper 1.21.11
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package --file pom.xml

      - name: Compile against Slimefun Legacy / Paper 26.2
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package --file pom.xml

      - name: Compile against Slimefun Legacy / Paper 26.3 alpha
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=26.3-rc-3.build.1-alpha
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package --file pom.xml

      - name: Build universal release JAR from Paper 1.21.11 baseline
        run: >-
          mvn -B -Dmaven.test.skip=true
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.wickidcow
          -Dslimefun.artifactId=Slimefun-Legacy
          -Dslimefun.version=${SLIMEFUN_LEGACY_VERSION}
          clean package --file pom.xml

      - name: Stage and validate versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE="target/${OUTPUT_NAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          unzip -p "$JAR" plugin.yml | grep -Fq 'version: 1.0.4'
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "$JAR" dev.walshy.sfmobdrops.SfMobDrops | grep -Fq 'major version: 65'
          if jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'; then echo 'Slimefun core classes must not be shaded into MobDrops.' >&2; exit 1; fi
          sha256sum "$JAR"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

