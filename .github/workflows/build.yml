name: Build SFMobDrops Legacy

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.0"

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify Legacy build metadata
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "<paper.version>[26.2.build,)</paper.version>" pom.xml
          grep -Fq "<maven.compiler.release>21</maven.compiler.release>" pom.xml
          grep -Fq "depend: [Slimefun]" src/main/resources/plugin.yml
          grep -Fq "api-version: '26.2'" src/main/resources/plugin.yml
          grep -Fq "<finalName>SF_MobDrops_Legacy_v\${project.version}</finalName>" pom.xml

          if grep -R --line-number '^import io\.github\.bakedlibs\.dough' src/main/java; then
            echo "Direct Dough imports should not be required by the Legacy build."
            exit 1
          fi

          echo "Legacy metadata checks passed."

      - name: Build SFMobDrops
        run: mvn -B -Dmaven.test.skip=true clean package --file pom.xml

      - name: Stage versioned Legacy JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*')
          test "${#jars[@]}" -eq 1
          OUTPUT="dist/SF_MobDrops_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          cp "${jars[0]}" "$OUTPUT"
          test -s "$OUTPUT"

          echo "Built: $OUTPUT"
          sha256sum "$OUTPUT"
          jar tf "$OUTPUT" | grep -Fq 'plugin.yml'
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "version: ${LEGACY_ARTIFACT_VERSION}"
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "api-version: '26.2'"

      - name: Upload direct versioned Legacy JAR
        uses: actions/upload-artifact@v7
        with:
          path: dist/SF_MobDrops_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct JAR release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          JAR="dist/SF_MobDrops_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --generate-notes --title "SFMobDrops Legacy $TAG"
          fi
